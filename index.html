function namesStep(){const names=[...new Set(state.raw.map(m=>m.sender))];return `<div class="standard-step"><span class="kicker">STEP 05 · IDENTITY PARADE</span><h2>Clean up the names.</h2><p class="muted">Replace nicknames if you wish. To merge two identities, give them the <b>same display name</b>.</p><div class="name-editor">${names.map((n,i)=>`<label class="person-edit"><span class="avatar" style="background:${gradients[i%gradients.length]}">${safe(n.slice(0,1).toUpperCase())}</span><span class="person-fields"><small>Original: ${safe(n)}</small><input data-alias="${safe(encodeURIComponent(n))}" value="${safe(state.aliases[n]??n)}" aria-label="Display name for ${safe(n)}"></span></label>`).join('')}</div><button data-action="next" class="button button-dark full">Names confirmed →</button></div>`;}
function toneStep(){return `<div class="standard-step"><span class="kicker">STEP 06 · CHOOSE YOUR NARRATOR</span><h2>How brutal should we be?</h2><p class="muted">A group-chat autopsy is not a court of law. Pick the tone.</p>
<div class="tone-list">${[['sharp','🧨','Unfiltered','Sharp, absurd and lovingly savage.'],['playful','🎭','Playful','Gentle teasing and excellent comic timing.'],['soft','☕','Mild roast','More affectionate, less scorched earth.']].map(([id,icon,title,desc])=>`<button class="tone-opt ${state.tone===id?'selected':''}" data-tone="${id}"><span>${icon}</span><span><b>${title}</b><small>${desc}</small></span><i>${state.tone===id?'✓':'○'}</i></button>`).join('')}</div>
<div class="ai-settings"><label class="toggle-label"><span><b>✦ Deep narrative mode (AI)</b><small>Closest to WhatBrandonThinks: digs into incidents, recurring jokes and individual stories. Requires your own Gemini key (free tier may be available).</small></span><input type="checkbox" data-input="ai" ${state.ai?'checked':''}></label>${state.ai?`<label class="field-label">Your Gemini API key<input id="api-key" type="password" autocomplete="off" placeholder="Paste API key (never stored)" value="${safe(state.apiKey)}"></label><p class="assist-note">Only curated excerpts selected from your chat will be sent to Google when you create the report. This is optional; Google’s data use and limits are governed by its terms. Create a key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio ↗</a>. Limits, eligibility and billing are controlled by Google. This page does not store your key.</p><label class="compact-check"><input type="checkbox" data-input="consent" ${state.consent?'checked':''}> I have permission to send selected messages to Google for this report.</label>`:''}</div>
<button data-action="next" class="button button-dark full">Almost there →</button></div>`;}
function finishStep(){const m=renameAndMerge(state.raw,state.aliases),s=buildStats(m),d=extractDossier(m);return `<div class="center-step finish-step"><div class="step-emoji">✳</div><span class="kicker">STEP 07 · OPEN THE CASE</span><h1>${fmt(s.total)} messages.<br><em>Zero excuses.</em></h1><p>Your free report will include a seven-part interactive reveal and an evidence-led write-up about ${s.participants.length} members.</p>
<div class="summary-counts"><div><b>${fmt(s.total)}</b><small>messages</small></div><div><b>${s.participants.length}</b><small>people</small></div><div><b>${d.episodes.length}</b><small>story leads</small></div></div><div class="note-card story-preview"><b>Story leads found</b><p>${d.episodes.slice(0,4).map(e=>`${safe(e.icon)} ${safe(e.topicName)} · ${dateStr(e.date)}`).join("<br>")}</p><p class="assist-note">${state.ai?"AI mode will turn these threads into original, longer storytelling based on selected evidence.":"The free local version connects the real exchanges and quotes. For a longer AI-written satire, enable Deep narrative mode on the previous screen."}</p></div>
<div class="data-promise">🛡️ ${state.ai?'AI writing sends selected chat excerpts to Google only after you press the button.':'The entire report will be created locally on your device.'}</div>
${state.error?`<p class="error-box">${safe(state.error)}</p>`:''}<button data-action="generate" class="button button-rainbow full" ${state.busy?'disabled':''}>✧ Create my report →</button></div>`;}
function scanning(){const total=state.stats?.total||state.raw.length;const sample=state.messages.slice(0,8);return `<div class="scan-screen"><div class="scan-inner"><div class="scan-digits">${fmt(total)}</div><p class="scan-of">messages under investigation</p><div class="scan-progress"><div class="scan-bar-inner"></div></div><div class="scan-chat">${sample.map((m,i)=>`<div class="scan-bubble ${i%2?'right':'left'}"><b>${safe(m.sender)}</b><p>${safe(trunc(m.text,60))}</p></div>`).join('')}</div><div class="scan-radar"><span>✳</span></div><p class="scan-status">Analysing the evidence…</p></div></div>`;}
function reveal(){return `<section class="reveal-wrap shell"><nav class="progress-nav"><button data-action="reveal-back" class="nav-back" aria-label="Previous screen">←</button><div class="progress-track"><div style="width:${(state.reveal+1)/7*100}%"></div></div><span>${state.reveal+1} of 7</span></nav>
<div class="reveal-inner">${[calendarPage,voicePage,rhythmPage,longestPage,firstPage,lastPage,wordsPage][state.reveal]()}
<button data-action="reveal-next" class="button ${state.reveal===6?'button-rainbow':'button-dark'} full reveal-continue">${state.reveal===6?'Read the full report':'Continue'} <span>→</span></button></div></section>`;}
function calendarPage(){const s=state.stats;const years=[...new Set(Object.keys(s.dayCounts).map(d=>+d.slice(0,4)))];const maxima=Math.max(...Object.values(s.dayCounts),1);return `<div class="stats-page"><h1>Your years, day by day.</h1><p class="muted">One square per day. The brighter, the more you talked.</p><div class="calendar-card"><h3>Calendar</h3>${years.map(y=>`<div class="year"><h4>${y}</h4><div class="year-grid">${Array.from({length:12},(_,month)=>`<div class="month-row"><small>${'JFMAMJJASOND'[month]}</small>${Array.from({length:31},(_,i)=>{const valid=i<new Date(y,month+1,0).getDate();const key=`${y}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;const count=s.dayCounts[key]||0;const val=count/maxima;const color=!valid?'transparent':count===0?'#313a56':val<.15?'#786e65':val<.35?'#b09c66':val<.65?'#e7bb54':'#ffcf5c';return `<i title="${safe(key)}: ${count} messages" style="background:${color}"></i>`;}).join('')}</div>`).join('')}</div></div>`).join('')}</div></div></div>`;}
function voicePage(){const s=state.stats,top=s.participants.slice(0,6),startsSum=s.participants.reduce((t,p)=>t+p.startCount,0)||1;return `<div class="stats-page"><h1>Who talks, who starts.</h1><div class="stat-tile lilac"><h3>Share of voice</h3><div class="voice-layout"><div class="donut" style="background:conic-gradient(${top.map((p,i)=>`${p.color} ${top.slice(0,i).reduce((a,c)=>a+c.pct,0)}% ${top.slice(0,i+1).reduce((a,c)=>a+c.pct,0)}%`).join(',')},#ddd 0)"><div></div></div><div class="voice-list">${top.map((p,i)=>`<div><i style="background:${p.color}"></i><span>#${i+1}</span><b>${safe(p.name)}</b><strong>${p.pct}%</strong></div>`).join('')}</div></div></div>
<div class="stat-tile pink"><h3>Who starts the conversation</h3>${top.map(p=>`<div class="start-row"><b>${safe(p.name)}</b><div><i style="width:${(p.startCount/startsSum)*100}%;background:${p.color}"></i></div><strong>${Math.round(p.startCount/startsSum*100)}%</strong></div>`).join('')}</div></div>`;}
function rhythmPage(){const s=state.stats,rank=s.participants.filter(p=>p.replyMinutes!==null).sort((a,b)=>a.replyMinutes-b.replyMinutes).slice(0,3),max=Math.max(...s.hourCounts,1);return `<div class="stats-page"><h1>Your rhythm.</h1><div class="stat-tile lilac"><h3>Median reply time</h3><div class="podium">${rank.length?rank.map((p,i)=>`<div class="podium-person"><span class="medal">${['🥇','🥈','🥉'][i]}</span><b>${safe(p.name)}</b><strong>${Math.round(p.replyMinutes)} <small>min</small></strong></div>`).join(''):'<p>Not enough replies to measure this reliably.</p>'}</div></div>
<div class="stat-tile peach"><h3>Record day</h3><div class="hero-stat"><b>${fmt(s.recordCount)}</b><span>messages on ${dateStr(s.recordDay+'T12:00:00')}</span></div></div>
<div class="split-tiles"><div class="stat-tile mint"><h3>Streak</h3><div class="hero-stat"><b>${s.bestStreak}</b><span>days</span></div></div><div class="stat-tile pink"><h3>Longest silence</h3><div class="hero-stat"><b>${s.longestSilence}</b><span>days</span></div></div></div><div class="stat-tile yellow"><h3>By hour</h3><div class="hours-bars">${s.hourCounts.map((v,i)=>`<div class="hour-bar" title="${i}:00 — ${v} messages"><i style="height:${Math.max(3,v/max*100)}%;opacity:${.35+v/max*.65}"></i></div>`).join('')}</div><div class="hours-labels"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div></div>`;}
function bubble(m){return `<div class="chat-bubble"><b>${safe(m.sender)}</b><div>${safe(trunc(m.text,500)).replace(/\n/g,'<br>')}</div><small>${m.date?timeStr(m.date):''}</small></div>`;}
function longestPage(){const m=[...state.messages].sort((a,b)=>(b.text.match(/\S+/g)||[]).length-(a.text.match(/\S+/g)||[]).length).slice(0,2);return `<div class="stats-page"><h1>The longest message.</h1>${m.map(msg=>`<div class="stat-tile beige longest-item"><h3>${safe(msg.sender)}</h3><div class="hero-stat"><b>${fmt((msg.text.match(/\S+/g)||[]).length)}</b><span>words</span></div><p class="muted">${dateStr(msg.date)}</p><div class="long-text ${state.more?'expanded':''}"><b>${safe(msg.sender)}</b><p>${safe(msg.text).replace(/\n/g,'<br>')}</p></div><button data-action="more" class="text-button">${state.more?'Show less':'See more'}</button></div>`).join('')}</div>`;}
function firstPage(){return `<div class="stats-page"><h1>It all started here.</h1><div class="stat-tile beige"><h3>${dateStr(state.stats.earliest)}</h3><div class="bubble-column">${state.stats.first.map(bubble).join('')}</div></div></div>`;}
function lastPage(){return `<div class="stats-page"><h1>And for now, it ends here.</h1><div class="stat-tile beige"><h3>${dateStr(state.stats.latest)}</h3><div class="bubble-column">${state.stats.last.map(bubble).join('')}</div></div></div>`;}
function wordsPage(){const s=state.stats;return `<div class="stats-page"><h1>Your words.</h1><div class="stat-tile mint"><h3>Most used words</h3><div class="word-rank">${s.commonWords.slice(0,5).map(([w,n],i)=>`<div><span>#${i+1}</span><b>${safe(w)}</b><small>${n}×</small></div>`).join('')||'Not enough text to calculate common words.'}</div></div><div class="stat-tile yellow"><h3>Most used emojis</h3><div class="emoji-rank">${s.commonEmojis.slice(0,7).map(([em])=>safe(em)).join(' ')||'No emojis found'}</div></div></div>`;}
function quoteBubble(q){if(!q)return '';return `<div class="report-quote"><span class="quote-who">${safe(q.sender)}</span><div>${safe(trunc(q.text,800)).replace(/\n/g,'<br>')}</div>${q.date?`<small>${dateStr(q.date)}</small>`:''}</div>`;}
function reportBody(){const story=state.story;return `<article class="report-article"><div class="report-hero"><div class="report-eyebrow">THE UNOFFICIAL GROUP CHAT REPORT · ${fmt(state.stats.total)} MESSAGES</div><h1>${safe(story.title)}</h1><p class="report-subtitle">${safe(story.subtitle||'The official, unofficial investigation')}</p><div class="report-author"><div class="auditor-avatar">🕵️</div><div><b>The Auditor</b><small>A digital investigator with too much time and very little restraint.</small></div></div></div>
<section class="report-opening">${(story.intro||[]).map(p=>`<p>${safe(p)}</p>`).join('')}<p><b>Let's get into it.</b></p></section>
<div class="toc"><h3>Still inside:</h3>${story.chapters.map((ch,i)=>`<a href="#chapter-${i}">${safe(ch.title)} <span>↗</span></a>`).join('')}<h3>A closer look at each member</h3>${story.profiles.map((p,i)=>`<a href="#member-${i}">${safe(p.emoji||'🎭')} ${safe(p.name)} — ${safe(p.title)}<span>↗</span></a>`).join('')}</div>
${story.chapters.map((ch,i)=>`<section id="chapter-${i}" class="report-chapter"><div class="chapter-icon">${['🏢','🍸','🎭','🧨','📋','🪩','🔎'][i%7]}</div><h2>${safe(ch.title)}</h2><div class="ornament">— ◆ —</div>${(ch.paragraphs||[]).map(p=>`<p>${safe(p)}</p>`).join('')}${ch.quotes?.length?`<div class="receipts-label">THE RECEIPTS · REAL CHAT EXCERPTS</div>${ch.quotes.map(quoteBubble).join('')}`:''}</section>`).join('')}
<section class="report-chapter profiles-section"><div class="chapter-icon">🎭</div><h2>The Rogues’ Gallery</h2><div class="ornament">— ◆ —</div><p>A completely unofficial performance review for the people who made this possible.</p>
${story.profiles.map((p,i)=>`<div class="report-profile" id="member-${i}"><span class="profile-emoji">${safe(p.emoji||'🕵️')}</span><h3>${safe(p.name)}</h3><h4>${safe(p.title)}</h4>${String(p.paragraph||"").split(/\n\n+/).map(para=>`<p>${safe(para)}</p>`).join("")}${quoteBubble(p.quote)}</div>`).join('')}</section>
<section class="report-verdict"><div class="chapter-icon">⚖️</div><h2>The Final Verdict</h2><p>${safe(story.verdict)}</p><p class="disclaimer">This is humorous commentary based on your exported messages, not an account of anyone's motives, private thoughts or conduct beyond the actual messages.</p></section>
</article>`;}
function report(){return `<section class="report-wrap"><div class="report-toolbar"><div class="shell report-tools"><button data-action="home" class="nav-back" aria-label="Start again">←</button><span class="toolbar-title">CASE FILE / ${safe(state.group||'THE GROUP')}</span><div class="toolbar-actions"><button data-action="save" title="Save offline HTML">↓ Save</button><button data-action="print" title="Print or save PDF">↗ Share / PDF</button></div></div></div>${reportBody()}<div class="end-actions shell"><button class="button button-dark" data-action="home">+ Analyse another chat</button><button class="button button-outline" data-action="save">Download this report</button></div><p class="privacy-footer">Your report is not published online. Sharing happens only if you choose to download or send it.</p></section>`;}
function doNext(){if(state.step===3&&!state.raw.length)return;
 if(state.step===4){const v=$('#groupname-input');if(v)state.group=v.value.trim().slice(0,80)||'The Group Chat';}
 if(state.step===5)document.querySelectorAll('[data-alias]').forEach(e=>{state.aliases[decodeURIComponent(e.dataset.alias)]=e.value.trim().slice(0,70)||decodeURIComponent(e.dataset.alias)});
 if(state.step===6){const v=$('#api-key');if(v)state.apiKey=v.value.trim();}
 state.step=Math.min(7,state.step+1);state.error='';render();scrollTo(0,0);
}
function backwards(){if(state.step>1){state.step--;render();scrollTo(0,0)}else{state.screen='home';render();}}
async function importFile(file){try{state.error='';const txt=await readChatFile(file);const arr=parseWhatsApp(txt,{monthFirst:state.dateMode==='month'});state.raw=arr;state.aliases={};state.source=file.name;state.group=state.group||file.name.replace(/\.(txt|zip)$/i,'').replace(/^_?chat\s*(with)?/i,'').trim()||'The Group Chat';render();}catch(e){state.error=e.message||'Unable to import this chat.';render();}}
function importDemo(){state.raw=demoMessages();state.aliases={};state.source='Fictional demo';state.group='The Extremely Questionable Committee';state.error='';if(state.screen!=='setup'){state.screen='setup';state.step=4;}render();}
async function generate(){if(state.busy)return;state.busy=true;state.error='';state.messages=renameAndMerge(state.raw,state.aliases);state.stats=buildStats(state.messages);
 if(state.ai&&(!state.apiKey||!state.consent)){state.error='To use AI, enter your API key and explicitly agree to sharing selected excerpts — or turn AI off in step 6.';state.busy=false;render();return;}
 state.screen='scanning';render();try{
   const local=storyData(state.messages,state.stats,{group:state.group,tone:state.tone});
   state.story=state.ai?await aiStory(state.messages,state.stats,{group:state.group,tone:state.tone,apiKey:state.apiKey}):local;
   if(!state.ai)await new Promise(r=>setTimeout(r,1300));
   state.reveal=0;state.screen='reveal';state.apiKey=''; // no persistent API key
 }catch(e){state.screen='setup';state.step=7;state.error='AI generation failed: '+String(e.message||e)+'. Go back to step 6 and switch AI off for a guaranteed free local report.';}
 finally{state.busy=false;render();scrollTo(0,0);}
}
function download(name,contents,type='text/html'){const blob=new Blob([contents],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function saveReport(){if(!state.story)return;const css=typeof EMBEDDED_CSS!=='undefined'?EMBEDDED_CSS:await fetch('./styles.css').then(r=>r.text()).catch(()=> 'body{font-family:Georgia,serif;max-width:820px;margin:50px auto}');
 const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${safe(state.story.title)}</title><style>${css}\n.site-head,.report-toolbar,.foot,.end-actions,.toolbar-actions,.privacy-footer{display:none!important}</style></head><body><main class="report-wrap">${reportBody()}</main></body></html>`;
 download('groupchat-unfiltered-report.html',html);
}
$('#app').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='start'){state.screen='setup';state.step=1;}
 if(a==='demo'){importDemo();return;}
 if(a==='demo-import'){importDemo();return;}
 if(a==='home'){state.screen='home';state.raw=[];state.messages=[];state.story=null;state.stats=null;state.aliases={};state.group='';state.tone='sharp';state.ai=false;state.consent=false;state.dateMode='day';state.error='';state.apiKey='';}
 if(a==='next'){doNext();return;}
 if(a==='back'){backwards();return;}
 if(a==='generate'){generate();return;}
 if(a==='reveal-next'){if(state.reveal===6){state.screen='report';}else{state.reveal++;state.more=false;}}
 if(a==='reveal-back'){if(state.reveal>0){state.reveal--;state.more=false;}else{state.screen='setup';state.step=7;}}
 if(a==='more')state.more=!state.more;
 if(a==='print'){window.print();return;}
 if(a==='save'){saveReport();return;}
 if(b.hasAttribute('data-tone'))state.tone=b.dataset.tone;
 render();scrollTo(0,0);
});
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-tone]');if(b){state.tone=b.dataset.tone;render();}});
$('#app').addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='file-input'){importFile(t.files?.[0]);return;}
 if(t.dataset.input==='monthFirst'){state.dateMode=t.checked?'month':'day';return;}
 if(t.dataset.input==='ai'){state.ai=t.checked;state.consent=false;render();return;}
 if(t.dataset.input==='consent'){state.consent=t.checked;return;}
});
$('#app').addEventListener('input',e=>{if(e.target.id==='api-key')state.apiKey=e.target.value;if(e.target.id==='groupname-input')state.group=e.target.value;});
$('#app').addEventListener('dragover',e=>{if(e.target.closest('#upload-area')){e.preventDefault();e.target.closest('#upload-area').classList.add('drag-over');}});
$('#app').addEventListener('dragleave',e=>{if(e.target.closest('#upload-area'))e.target.closest('#upload-area').classList.remove('drag-over');});
$('#app').addEventListener('drop',e=>{if(e.target.closest('#upload-area')){e.preventDefault();importFile(e.dataTransfer.files[0]);}});
render();

</script>
</body>
</html>
